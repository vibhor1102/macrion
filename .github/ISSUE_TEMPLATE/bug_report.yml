name: Bug report
description: Report something that isn't working as expected
labels: [bug]
assignees: [vibhor1102]
body:
  - type: input
    id: app-version
    attributes:
      label: Macrion version
      description: You can find this in Macrion's settings.
    validations:
      required: true

  - type: input
    id: installation
    attributes:
      label: Installation source
      description: Where did you install Macrion from?
      placeholder: F-Droid, GitHub, or another source
    validations:
      required: false

  - type: input
    id: device-type
    attributes:
      label: Device brand and model
      placeholder: OnePlus 10 Pro
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: You can usually find this in your phone's settings under About phone.
      placeholder: "14"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Where does the issue occur?
      options:
        - Smart scenario
        - Simple scenario
        - Backup
        - Other
    validations:
      required: true

  - type: textarea
    id: describe-issue
    attributes:
      label: Describe the issue
      description: Tell us what went wrong and what you expected instead.
      placeholder: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce (optional)
      description: Share the smallest set of steps that consistently triggers the issue, if you know them.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: A screenshot, screen recording, or small scenario backup can help. Remove any private information before attaching files.
      placeholder: Drag files here or add anything else that may help.
    validations:
      required: false
