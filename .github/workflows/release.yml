# Recovery-only workflow on recover-0.5.0-r8-mapping; do not merge over the release workflow.
name: Recover 0.5.0 R8 mapping

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out the exact 0.5.0 source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: cccd3365e738cc10df1cf8c9adf70bfd5f3aae96
        persist-credentials: false

    - name: Set up the original JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '21.0.12+1'

    - name: Set up pinned Android NDK 28.2.13676358
      shell: bash
      run: |
        ndk_path="$ANDROID_HOME/ndk/28.2.13676358"
        if [ ! -d "$ndk_path" ]; then
          echo "Installing NDK 28.2.13676358 via sdkmanager..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
        fi
        echo "ANDROID_NDK=$ndk_path" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"

    - name: Build the original release without signing
      run: ./gradlew --no-daemon --no-build-cache --max-workers=2 :smartautoclicker:assembleFDroidRelease
      env:
        JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Duser.timezone=UTC"

    - name: Preserve R8 mapping and release outputs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macrion-0.5.0-recovered-r8
        retention-days: 90
        if-no-files-found: error
        path: |
          smartautoclicker/build/outputs/mapping/fDroidRelease/
          smartautoclicker/build/outputs/apk/fDroid/release/*.apk

    - name: Download the published universal APK for comparison
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release download v0.5.0 --repo vibhor1102/Macrion --pattern macrion-0.5.0-universal.apk --dir published

    - name: Verify mapping hash and compiled DEX against the original
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import hashlib
        import os
        from pathlib import Path
        import re
        import zipfile

        expected = '16b6e7db1531edc1fe03914467d08034cc6ef17f7d28fd0ce0f8bf9bf76ed19a'
        mapping = Path('smartautoclicker/build/outputs/mapping/fDroidRelease/mapping.txt')
        header = mapping.read_text().splitlines()[:20]
        print('Mapping header:')
        print('\n'.join(header))
        hash_matches = any(expected in line for line in header)
        original = Path('published/macrion-0.5.0-universal.apk')
        rebuilt = [p for p in Path('smartautoclicker/build/outputs/apk/fDroid/release').glob('*.apk')
                   if not any(abi in p.name for abi in ('arm64-v8a', 'armeabi-v7a', 'x86'))]
        assert len(rebuilt) == 1, rebuilt

        def dex_hashes(apk):
            with zipfile.ZipFile(apk) as archive:
                return {name: hashlib.sha256(archive.read(name)).hexdigest()
                        for name in archive.namelist() if re.fullmatch(r'classes[0-9]*\.dex', name)}

        original_dex = dex_hashes(original)
        rebuilt_dex = dex_hashes(rebuilt[0])
        dex_matches = bool(original_dex) and original_dex == rebuilt_dex
        for name in sorted(original_dex.keys() | rebuilt_dex.keys()):
            print(f'{name}: original={original_dex.get(name)} rebuilt={rebuilt_dex.get(name)}')
        summary = f'Mapping hash matches crash: {hash_matches}\nDEX byte hashes match published APK: {dex_matches}\n'
        print(summary)
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write(summary)
        assert hash_matches and dex_matches, 'Reproduction needs further investigation'
        PYCODE
