name: Check diagnostic archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnostics/**'
      - '.github/workflows/check-diagnostic-archive.yml'
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'vibhor1102/macrion' || github.repository == 'vibhor1102/Macrion'
    runs-on: ubuntu-latest
    environment: github-release
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate packaging
        run: python3 scripts/diagnostics/test_archive.py
      - name: Verify archive credentials and clean up the test draft
        env:
          GH_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
        run: python3 scripts/diagnostics/check_remote.py
