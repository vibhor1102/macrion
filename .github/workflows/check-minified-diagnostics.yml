name: Check minified diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-minified-diagnostics.yml'
      - 'scripts/diagnostics/check_compose_mapping.py'
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install release NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"'
      - name: Build unsigned ARM64 release
        env:
          JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Duser.timezone=UTC
        run: ./gradlew --no-daemon --no-build-cache --max-workers=2 -PmacrionAbi=arm64-v8a :smartautoclicker:assembleFDroidRelease
      - name: Verify Compose group-key decoding
        run: |
          python3 scripts/diagnostics/check_compose_mapping.py \
            smartautoclicker/build/outputs/mapping/fDroidRelease/mapping.txt \
            "$ANDROID_HOME/cmdline-tools/latest/bin/retrace"
      - name: Verify release archive packaging
        run: |
          python3 scripts/diagnostics/archive.py package \
            --mapping-dir smartautoclicker/build/outputs/mapping/fDroidRelease \
            --native-root core/smart/detection/build/intermediates/cxx/Release \
            --output compiler-diagnostics --version validation --commit "$GITHUB_SHA"
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts/diagnostics'); from archive import inspect; [inspect(p) for p in Path('compiler-diagnostics').glob('*.zip')]"
      - name: Retain compiler diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minified-diagnostics-${{ github.sha }}
          path: compiler-diagnostics/*.zip
          retention-days: 14
          if-no-files-found: error
