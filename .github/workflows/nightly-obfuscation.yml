name: Nightly Obfuscation

on:
  schedule:
    - cron: "0 0 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obfuscated-apks
  cancel-in-progress: false

jobs:
  build:
    name: Build latest stable release with randomized identity
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Resolve the latest stable release
      id: release
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          let tag = '';
          let target = '';
          if (context.eventName === 'release' && !context.payload.release.prerelease && !context.payload.release.draft) {
            tag = context.payload.release.tag_name;
            target = context.payload.release.target_commitish;
          } else {
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const stableRelease = releases.data.find(r => !r.draft && !r.prerelease);
            if (!stableRelease) {
              throw new Error("No stable release found");
            }
            tag = stableRelease.tag_name;
            target = stableRelease.target_commitish;
          }
          core.setOutput('tag', tag);
          core.setOutput('target', target);

    - name: Checkout latest stable release
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ steps.release.outputs.tag }}

    - name: Set up JDK 21 and restore Gradle cache
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: zulu
        java-version: '21'
        cache: gradle
        cache-dependency-path: |
          **/*.gradle
          **/*.gradle.kts
          gradle/libs.versions.toml
          gradle/wrapper/gradle-wrapper.properties

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

    - name: Install ccache
      run: sudo apt-get install -y ccache

    - name: Restore ccache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .ccache
        key: ${{ runner.os }}-obfuscation-ccache-${{ hashFiles('**/*.c', '**/*.cc', '**/*.cpp', '**/*.h', '**/CMakeLists.txt', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-obfuscation-ccache-

    - name: Restore and validate obfuscated release keystore
      shell: bash
      run: |
        echo "${{ secrets.OBFUSCATED_KEYSTORE_BASE64 }}" | base64 -d > smartautoclicker/smartautoclicker.jks
        keytool -list \
          -keystore smartautoclicker/smartautoclicker.jks \
          -storepass "${{ secrets.OBFUSCATED_STORE_PASSWORD }}" \
          -alias "${{ secrets.OBFUSCATED_KEY_ALIAS }}" \
          >/dev/null

    - name: Build obfuscated release APKs
      shell: bash
      env:
        USE_CCACHE: 'true'
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      run: |
        ccache -M 500M
        ./gradlew --no-daemon --max-workers=6 --parallel --build-cache \
          -PrandomizeAppId=true \
          -PsigningStorePassword="${{ secrets.OBFUSCATED_STORE_PASSWORD }}" \
          -PsigningKeyAlias="${{ secrets.OBFUSCATED_KEY_ALIAS }}" \
          -PsigningKeyPassword="${{ secrets.OBFUSCATED_KEY_PASSWORD }}" \
          :smartautoclicker:assembleFDroidRelease
        ccache -s

    - name: Verify and name obfuscated APKs
      id: artifacts
      shell: bash
      run: |
        tag='${{ steps.release.outputs.tag }}'
        version="${tag#v}"
        AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
        APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
        mkdir obfuscated-artifacts

        for apk in smartautoclicker/build/outputs/apk/fDroid/release/*.apk; do
          filename="${apk##*/}"
          package_name="$($AAPT2 dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test -n "$package_name"
          test "$package_name" != 'io.github.vibhor1102.macrion'
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          case "$filename" in
            *-arm64-v8a-release.apk) asset="macrion-obfuscated-${version}-arm64-v8a.apk" ;;
            *-armeabi-v7a-release.apk) asset="macrion-obfuscated-${version}-armeabi-v7a.apk" ;;
            *-x86_64-release.apk) asset="macrion-obfuscated-${version}-x86_64.apk" ;;
            *-x86-release.apk) asset="macrion-obfuscated-${version}-x86.apk" ;;
            *-release.apk) asset="macrion-obfuscated-${version}-universal.apk" ;;
            *) echo "Unexpected APK filename: $filename" >&2; exit 1 ;;
          esac
          cp "$apk" "obfuscated-artifacts/$asset"
        done

        test -n "$(find obfuscated-artifacts -name '*.apk' -print -quit)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Update persistent obfuscated-APK release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag='obfuscation-start'
        source_tag='${{ steps.release.outputs.tag }}'
        source_sha="$(git rev-parse HEAD)"
        cat > obfuscation-release-notes.md <<EOF
        Current obfuscated Macrion APKs are built from [${source_tag}](https://github.com/${{ github.repository }}/releases/tag/${source_tag}) at \`${source_sha}\`.

        These APKs use a randomized Android application identity, so they install alongside the standard Macrion release instead of updating it.
        EOF

        gh release create "$tag" \
          --title 'Latest obfuscated Macrion APKs' \
          --notes-file obfuscation-release-notes.md \
          --prerelease \
          --repo '${{ github.repository }}' \
          || true
        gh release edit "$tag" \
          --title 'Latest obfuscated Macrion APKs' \
          --notes-file obfuscation-release-notes.md \
          --prerelease \
          --repo '${{ github.repository }}'
        while IFS= read -r asset; do
          gh release delete-asset "$tag" "$asset" --yes --repo '${{ github.repository }}'
        done < <(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".apk"))' --repo '${{ github.repository }}')
        gh release upload "$tag" obfuscated-artifacts/*.apk --clobber --repo '${{ github.repository }}'

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: macrion-obfuscated-${{ steps.artifacts.outputs.version }}
        retention-days: 14
        path: obfuscated-artifacts/*.apk
